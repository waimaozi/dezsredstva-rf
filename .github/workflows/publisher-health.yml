name: Translation publisher health
on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest public publisher status
        run: |
          python3 - <<'PY'
          import datetime as d, json, urllib.request
          url = 'https://xn--80adfaeaaojaaa6d2bcpdslq7b4d3f.xn--p1ai/publisher-status.json'
          with urllib.request.urlopen(url, timeout=30) as response:
              status = json.load(response)
          print(json.dumps(status, ensure_ascii=False, indent=2))
          age = d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(status['checked_at'])
          assert age < d.timedelta(days=9), 'Publisher heartbeat is stale'
          assert status['status'] == 'published', 'Editorial queue needs attention: ' + status['status']
          with urllib.request.urlopen(status['published'], timeout=30) as response:
              assert response.status == 200, 'Latest translation is unavailable'
          PY
